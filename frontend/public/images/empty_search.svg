<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" width="100%" height="100%">
  <!-- Background subtle warm tint -->
  <rect width="320" height="200" rx="8" fill="#F5F2EB" />
  
  <!-- Architectural blueprint gridlines -->
  <path d="M40 160h240M40 120h240M40 80h240M80 40v120M160 40v120M240 40v120" stroke="#E5E1D8" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Desk & magnifying desk lamp composition -->
  <rect x="70" y="145" width="180" height="6" rx="2" fill="#252724" />
  
  <!-- Stack of academic journals -->
  <rect x="95" y="130" width="45" height="7" rx="1" fill="#727D60" />
  <rect x="92" y="137" width="50" height="8" rx="1" fill="#E5E1D8" stroke="#252724" stroke-width="1.5" />
  
  <!-- Magnifying glass examining unwritten paper -->
  <rect x="155" y="115" width="50" height="30" rx="2" fill="#FFFFFF" stroke="#252724" stroke-width="1.5" />
  <line x1="162" y1="123" x2="198" y2="123" stroke="#E5E1D8" stroke-width="2" stroke-linecap="round"/>
  <line x1="162" y1="130" x2="188" y2="130" stroke="#E5E1D8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Magnifying glass with terracotta reflection -->
  <circle cx="190" cy="105" r="24" fill="#FFFFFF" fill-opacity="0.8" stroke="#252724" stroke-width="2.5" />
  <circle cx="190" cy="105" r="20" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="207" y1="122" x2="225" y2="140" stroke="#252724" stroke-width="3" stroke-linecap="round" />
  
  <!-- Floating query motif -->
  <circle cx="188" cy="102" r="2" fill="#727D60" />
</svg>
